name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '22'
  NODE_ENV: 'test'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Lint - ESLint
        run: npm run lint || true
        continue-on-error: true

      - name: Tests unitarios (sin games)
        run: npm test
        env:
          # Usa el secret si existe; si no, el Mongo temporal del service de arriba
          MONGO_URI: ${{ secrets.MONGO_URI_TEST || 'mongodb://localhost:27017/divoon-test' }}
          VALORANT_API_URL: ${{ secrets.VALORANT_API_URL || 'https://api.kyroskoh.xyz/valorant/v1/mmr/na/DiamondStalker/MaMi?show=combo&display=0' }}
          NODE_ENV: test

      - name: Generar coverage report
        run: npm test -- --coverage || true
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Syntax check
        run: node -c index.js

  security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Dependency check
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

  automerge:
    needs: [test, security]
    runs-on: ubuntu-latest
    # Solo PRs hacia main, desde ramas de este repo (no forks) y que no sean draft
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --merge --delete-branch
